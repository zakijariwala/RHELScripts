# CI: the same checks as the pre-commit hook, plus gitleaks and the
# checksum check on RHEL 8 and 9 rebuilds. Every job fails loudly.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tools/check-all.sh
        run: |
          shellcheck --version
          tools/check-all.sh

  # The fresher verifies typed scripts with gawk on RHEL. The README
  # tables come from the same commands; prove gawk gives the same hashes
  # and that every script parses with RHEL's bash.
  rhel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["rockylinux:8", "rockylinux:9"]
    container: ${{ matrix.image }}
    steps:
      - name: install tools
        run: dnf -y -q install git-core findutils gawk coreutils diffutils
      - uses: actions/checkout@v4
      - name: bash -n every script
        run: |
          bash --version | head -1
          for f in scripts/*/*/*.sh; do bash -n "$f" || exit 1; done
      - name: checksum tables match under gawk
        run: |
          awk --version | head -1
          tools/gen-checksums.sh --check

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
