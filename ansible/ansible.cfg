# Skeleton. Pass the inventory for this control node with -i, for example
#   ansible-playbook -i inventory/app-prod.ini playbooks/checks/<name>.yml
[defaults]
roles_path = roles
host_key_checking = True
retry_files_enabled = False
forks = 5
timeout = 10

[ssh_connection]
ssh_args = -o BatchMode=yes -o ConnectTimeout=10
pipelining = True
